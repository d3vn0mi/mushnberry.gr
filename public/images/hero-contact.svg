<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="50%" stop-color="#5D4037" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C2185B" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F9A825" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <!-- Subtle plant motifs -->
  <g stroke="#2E7D32" stroke-width="1.5" fill="none" opacity="0.15">
    <path d="M300 800 Q300 600 400 500 Q350 600 300 800"/>
    <path d="M300 800 Q280 620 200 540 Q260 620 300 800"/>
    <path d="M300 800 Q320 650 420 580"/>
    <path d="M1620 800 Q1620 600 1520 500 Q1570 600 1620 800"/>
    <path d="M1620 800 Q1640 620 1720 540 Q1660 620 1620 800"/>
    <path d="M1620 800 Q1600 650 1500 580"/>
  </g>
  <!-- Leaf shapes -->
  <g opacity="0.12" fill="#2E7D32">
    <ellipse cx="400" cy="500" rx="40" ry="15" transform="rotate(-40 400 500)"/>
    <ellipse cx="200" cy="540" rx="35" ry="12" transform="rotate(30 200 540)"/>
    <ellipse cx="1520" cy="500" rx="40" ry="15" transform="rotate(40 1520 500)"/>
    <ellipse cx="1720" cy="540" rx="35" ry="12" transform="rotate(-30 1720 540)"/>
  </g>
  <!-- Warm connecting lines -->
  <g stroke="#F9A825" stroke-width="1" opacity="0.1">
    <line x1="700" y1="400" x2="1220" y2="400"/>
    <line x1="750" y1="480" x2="1170" y2="480"/>
    <line x1="800" y1="560" x2="1120" y2="560"/>
  </g>
  <!-- Central envelope/message shape -->
  <g opacity="0.15" transform="translate(960 470)">
    <rect x="-100" y="-60" width="200" height="120" rx="10" fill="none" stroke="#F9A825" stroke-width="2"/>
    <path d="M-100 -60 L0 20 L100 -60" fill="none" stroke="#F9A825" stroke-width="2"/>
  </g>
  <!-- Ambient dots -->
  <circle cx="500" cy="250" r="2" fill="#F9A825" opacity="0.3"/>
  <circle cx="960" cy="180" r="3" fill="#C2185B" opacity="0.2"/>
  <circle cx="1400" cy="300" r="2" fill="#F9A825" opacity="0.3"/>
  <rect x="0" y="880" width="1920" height="200" fill="#1A1A2E" opacity="0.5"/>
</svg>