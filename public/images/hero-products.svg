<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#C2185B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F9A825" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#F9A825" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>
  <!-- Abstract leaf shapes -->
  <g opacity="0.25">
    <ellipse cx="350" cy="400" rx="80" ry="30" transform="rotate(-30 350 400)" fill="#2E7D32"/>
    <ellipse cx="320" cy="440" rx="70" ry="25" transform="rotate(-50 320 440)" fill="#388E3C"/>
    <ellipse cx="1550" cy="350" rx="90" ry="28" transform="rotate(20 1550 350)" fill="#2E7D32"/>
    <ellipse cx="1580" cy="390" rx="75" ry="22" transform="rotate(40 1580 390)" fill="#388E3C"/>
  </g>
  <!-- Abstract fruit shapes -->
  <g opacity="0.3">
    <!-- Berry cluster left -->
    <circle cx="700" cy="480" r="45" fill="#C2185B"/>
    <circle cx="760" cy="450" r="40" fill="#D32F2F"/>
    <circle cx="740" cy="520" r="38" fill="#AD1457"/>
    <!-- Berry cluster right -->
    <circle cx="1200" cy="500" r="42" fill="#C2185B"/>
    <circle cx="1255" cy="475" r="38" fill="#D32F2F"/>
    <circle cx="1240" cy="540" r="35" fill="#AD1457"/>
  </g>
  <!-- Abstract mushroom fan -->
  <g opacity="0.25" transform="translate(960 550)">
    <ellipse cx="0" cy="-30" rx="70" ry="35" fill="#8D6E63"/>
    <ellipse cx="-40" cy="-10" rx="60" ry="30" fill="#6D4C41"/>
    <ellipse cx="40" cy="-10" rx="60" ry="30" fill="#795548"/>
    <rect x="-8" y="0" width="16" height="60" rx="6" fill="#5D4037"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="500" cy="300" r="3" fill="#F9A825" opacity="0.3"/>
  <circle cx="960" cy="200" r="4" fill="#F9A825" opacity="0.25"/>
  <circle cx="1400" cy="280" r="3" fill="#F9A825" opacity="0.3"/>
  <circle cx="300" cy="700" r="2" fill="#2E7D32" opacity="0.3"/>
  <circle cx="1600" cy="680" r="2" fill="#2E7D32" opacity="0.3"/>
  <rect x="0" y="880" width="1920" height="200" fill="#1A1A2E" opacity="0.5"/>
</svg>