<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="50%" stop-color="#3E2723"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <radialGradient id="warm" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#F9A825" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#warm)"/>
  <!-- Greenhouse arch background -->
  <path d="M100 500 L100 250 Q400 50 700 250 L700 500Z" fill="#2E7D32" opacity="0.08"/>
  <path d="M100 500 L100 250 Q400 50 700 250 L700 500Z" fill="none" stroke="#2E7D32" stroke-width="1.5" opacity="0.12"/>
  <!-- Greenhouse ribs -->
  <path d="M250 500 L250 220 Q400 100 400 120" stroke="#2E7D32" stroke-width="0.8" fill="none" opacity="0.08"/>
  <path d="M400 500 L400 130" stroke="#2E7D32" stroke-width="0.8" fill="none" opacity="0.08"/>
  <path d="M550 500 L550 220" stroke="#2E7D32" stroke-width="0.8" fill="none" opacity="0.08"/>
  <!-- Person silhouettes -->
  <!-- Person 1 - left -->
  <g opacity="0.4" transform="translate(220 310)">
    <circle cx="0" cy="0" r="22" fill="#8D6E63"/>
    <path d="M-30 40 Q-35 100 -25 150 L25 150 Q35 100 30 40 Q15 25 0 25 Q-15 25 -30 40Z" fill="#6D4C41"/>
  </g>
  <!-- Person 2 - center left -->
  <g opacity="0.5" transform="translate(330 300)">
    <circle cx="0" cy="0" r="24" fill="#A1887F"/>
    <path d="M-32 42 Q-38 105 -28 160 L28 160 Q38 105 32 42 Q16 27 0 27 Q-16 27 -32 42Z" fill="#795548"/>
  </g>
  <!-- Person 3 - center (slightly taller/forward) -->
  <g opacity="0.55" transform="translate(430 290)">
    <circle cx="0" cy="0" r="25" fill="#BCAAA4"/>
    <path d="M-34 44 Q-40 110 -30 170 L30 170 Q40 110 34 44 Q17 28 0 28 Q-17 28 -34 44Z" fill="#8D6E63"/>
  </g>
  <!-- Person 4 - center right -->
  <g opacity="0.45" transform="translate(540 305)">
    <circle cx="0" cy="0" r="23" fill="#A1887F"/>
    <path d="M-30 40 Q-36 102 -26 155 L26 155 Q36 102 30 40 Q15 26 0 26 Q-15 26 -30 40Z" fill="#6D4C41"/>
  </g>
  <!-- Person 5 - right -->
  <g opacity="0.4" transform="translate(620 315)">
    <circle cx="0" cy="0" r="21" fill="#8D6E63"/>
    <path d="M-28 38 Q-33 95 -23 145 L23 145 Q33 95 28 38 Q14 24 0 24 Q-14 24 -28 38Z" fill="#5D4037"/>
  </g>
  <!-- Ground/floor line -->
  <rect x="80" y="480" width="640" height="3" rx="1" fill="#5D4037" opacity="0.25"/>
  <!-- Warm light dots -->
  <circle cx="300" cy="150" r="2" fill="#F9A825" opacity="0.2"/>
  <circle cx="500" cy="130" r="2" fill="#F9A825" opacity="0.15"/>
  <circle cx="400" cy="100" r="3" fill="#F9A825" opacity="0.1"/>
</svg>