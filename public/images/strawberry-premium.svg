<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2C1A1A"/>
      <stop offset="100%" stop-color="#0D0D15"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="30%">
      <stop offset="0%" stop-color="#F9A825" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#F9A825" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="berry" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#F44336"/>
      <stop offset="40%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#8E0000"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#spot)"/>
  <!-- Single premium strawberry - larger, centered -->
  <g transform="translate(400 250)">
    <!-- Shadow -->
    <ellipse cx="5" cy="180" rx="80" ry="15" fill="#000" opacity="0.3"/>
    <!-- Berry body -->
    <path d="M0 -70 Q60 -50 70 60 Q55 140 0 160 Q-55 140 -70 60 Q-60 -50 0 -70Z" fill="url(#berry)" opacity="0.85"/>
    <!-- Shine highlight -->
    <path d="M0 -70 Q60 -50 70 60 Q55 140 0 160 Q-55 140 -70 60 Q-60 -50 0 -70Z" fill="url(#shine)"/>
    <!-- Seeds -->
    <g fill="#F9A825" opacity="0.35">
      <ellipse cx="-25" cy="-20" rx="3" ry="4" transform="rotate(-10 -25 -20)"/>
      <ellipse cx="20" cy="-10" rx="3" ry="4" transform="rotate(10 20 -10)"/>
      <ellipse cx="-30" cy="20" rx="3" ry="4" transform="rotate(-15 -30 20)"/>
      <ellipse cx="25" cy="30" rx="3" ry="4" transform="rotate(12 25 30)"/>
      <ellipse cx="-15" cy="60" rx="3" ry="4" transform="rotate(-8 -15 60)"/>
      <ellipse cx="15" cy="70" rx="3" ry="4" transform="rotate(8 15 70)"/>
      <ellipse cx="-20" cy="100" rx="3" ry="4" transform="rotate(-5 -20 100)"/>
      <ellipse cx="20" cy="110" rx="3" ry="4" transform="rotate(5 20 110)"/>
      <ellipse cx="0" cy="130" rx="3" ry="4"/>
      <ellipse cx="-5" cy="40" rx="3" ry="4"/>
      <ellipse cx="35" cy="60" rx="3" ry="4" transform="rotate(15 35 60)"/>
      <ellipse cx="-35" cy="65" rx="3" ry="4" transform="rotate(-15 -35 65)"/>
    </g>
    <!-- Calyx (leaves at top) -->
    <g fill="#2E7D32" opacity="0.7">
      <ellipse cx="-25" cy="-75" rx="30" ry="10" transform="rotate(-30 -25 -75)"/>
      <ellipse cx="25" cy="-75" rx="30" ry="10" transform="rotate(30 25 -75)"/>
      <ellipse cx="0" cy="-80" rx="25" ry="8" transform="rotate(0 0 -80)"/>
      <ellipse cx="-40" cy="-65" rx="22" ry="8" transform="rotate(-50 -40 -65)"/>
      <ellipse cx="40" cy="-65" rx="22" ry="8" transform="rotate(50 40 -65)"/>
    </g>
    <!-- Stem -->
    <rect x="-4" y="-95" width="8" height="22" rx="3" fill="#388E3C" opacity="0.6"/>
  </g>
  <!-- Subtle rim light on edges -->
  <circle cx="400" cy="300" r="250" fill="none" stroke="#C2185B" stroke-width="1" opacity="0.05"/>
</svg>