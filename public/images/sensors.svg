<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#1A2A3E"/>
    </linearGradient>
    <radialGradient id="signal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9A825" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Grid pattern background -->
  <g stroke="#F9A825" stroke-width="0.3" opacity="0.05">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- Sensor device 1 - Temperature -->
  <g transform="translate(200 180)">
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#263238" stroke="#F9A825" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#C2185B" opacity="0.5"/>
    <!-- Signal waves -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#F9A825" stroke-width="0.8" opacity="0.15"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#F9A825" stroke-width="0.6" opacity="0.1"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#F9A825" stroke-width="0.4" opacity="0.05"/>
  </g>
  <!-- Sensor device 2 - Humidity -->
  <g transform="translate(400 300)">
    <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#263238" stroke="#2E7D32" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="7" fill="#2E7D32" opacity="0.5"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#2E7D32" stroke-width="0.8" opacity="0.15"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#2E7D32" stroke-width="0.6" opacity="0.1"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#2E7D32" stroke-width="0.4" opacity="0.05"/>
  </g>
  <!-- Sensor device 3 - Light -->
  <g transform="translate(600 200)">
    <rect x="-18" y="-18" width="36" height="36" rx="5" fill="#263238" stroke="#F9A825" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#F9A825" opacity="0.5"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#F9A825" stroke-width="0.8" opacity="0.15"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#F9A825" stroke-width="0.6" opacity="0.1"/>
  </g>
  <!-- Sensor device 4 - CO2 -->
  <g transform="translate(300 430)">
    <rect x="-19" y="-19" width="38" height="38" rx="6" fill="#263238" stroke="#C2185B" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#C2185B" opacity="0.5"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#C2185B" stroke-width="0.8" opacity="0.12"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#C2185B" stroke-width="0.5" opacity="0.08"/>
  </g>
  <!-- Sensor device 5 - pH -->
  <g transform="translate(580 420)">
    <rect x="-17" y="-17" width="34" height="34" rx="5" fill="#263238" stroke="#2E7D32" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="5" fill="#2E7D32" opacity="0.5"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#2E7D32" stroke-width="0.7" opacity="0.12"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#2E7D32" stroke-width="0.5" opacity="0.07"/>
  </g>
  <!-- Connection lines between sensors -->
  <g stroke="#F9A825" stroke-width="0.8" opacity="0.08" stroke-dasharray="4 4">
    <line x1="200" y1="180" x2="400" y2="300"/>
    <line x1="400" y1="300" x2="600" y2="200"/>
    <line x1="400" y1="300" x2="300" y2="430"/>
    <line x1="400" y1="300" x2="580" y2="420"/>
  </g>
  <!-- Data flow dots -->
  <circle cx="300" cy="240" r="2" fill="#F9A825" opacity="0.3"/>
  <circle cx="500" cy="250" r="2" fill="#2E7D32" opacity="0.3"/>
  <circle cx="350" cy="365" r="2" fill="#C2185B" opacity="0.25"/>
</svg>