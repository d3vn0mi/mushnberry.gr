<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none">
  <!-- Monogram mark: M with integrated mushroom cap top + strawberry leaf accent -->
  <g>
    <!-- Mushroom cap dome over the M -->
    <path d="M8 20 C8 8, 40 8, 40 20" fill="#C2185B" opacity="0.2"/>
    <!-- Main M letterform -->
    <path d="M10 38 L10 18 L24 30 L38 18 L38 38" stroke="#C2185B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Mushroom cap: two overlapping fan arcs -->
    <path d="M6 20 Q24 2 42 20" stroke="#C2185B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M11 18 Q24 6 37 18" stroke="#5D4037" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Small strawberry leaf accent at top-right -->
    <path d="M38 12 C42 8, 46 10, 44 14" fill="#2E7D32"/>
    <path d="M38 12 C40 14, 44 16, 44 14" fill="#2E7D32" opacity="0.7"/>
    <!-- Tiny berry dot -->
    <circle cx="42" cy="16" r="2" fill="#C2185B"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="35" font-family="Georgia, 'Playfair Display', serif" font-size="26" font-weight="700" fill="#F5F5F5" letter-spacing="-0.5">
    Mushnberry
  </text>
</svg>
