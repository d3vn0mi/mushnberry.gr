<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#F9A825" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#light)"/>
  <!-- Oyster mushroom fan layers -->
  <g transform="translate(400 320)">
    <!-- Back fan layers -->
    <ellipse cx="-60" cy="-80" rx="110" ry="50" transform="rotate(-20 -60 -80)" fill="#A1887F" opacity="0.5"/>
    <ellipse cx="70" cy="-90" rx="100" ry="45" transform="rotate(15 70 -90)" fill="#BCAAA4" opacity="0.5"/>
    <ellipse cx="0" cy="-60" rx="120" ry="55" transform="rotate(-5 0 -60)" fill="#D7CCC8" opacity="0.45"/>
    <!-- Middle fan layers -->
    <ellipse cx="-40" cy="-30" rx="105" ry="48" transform="rotate(-25 -40 -30)" fill="#BCAAA4" opacity="0.55"/>
    <ellipse cx="50" cy="-40" rx="95" ry="42" transform="rotate(10 50 -40)" fill="#D7CCC8" opacity="0.5"/>
    <!-- Front fan layers -->
    <ellipse cx="-20" cy="10" rx="100" ry="45" transform="rotate(-15 -20 10)" fill="url(#cap)" opacity="0.6"/>
    <ellipse cx="30" cy="0" rx="90" ry="40" transform="rotate(8 30 0)" fill="#D7CCC8" opacity="0.55"/>
    <!-- Stem cluster -->
    <rect x="-15" y="30" width="12" height="70" rx="5" fill="#A1887F" opacity="0.5"/>
    <rect x="0" y="25" width="14" height="80" rx="6" fill="#BCAAA4" opacity="0.5"/>
    <rect x="15" y="35" width="11" height="65" rx="5" fill="#A1887F" opacity="0.45"/>
  </g>
  <!-- Gill lines on front cap -->
  <g stroke="#8D6E63" stroke-width="0.7" opacity="0.15">
    <line x1="320" y1="330" x2="380" y2="370"/>
    <line x1="340" y1="325" x2="395" y2="360"/>
    <line x1="360" y1="322" x2="410" y2="355"/>
    <line x1="380" y1="320" x2="425" y2="350"/>
    <line x1="400" y1="320" x2="440" y2="348"/>
  </g>
  <!-- Subtle particles -->
  <circle cx="200" cy="150" r="2" fill="#F9A825" opacity="0.2"/>
  <circle cx="600" cy="180" r="2" fill="#F9A825" opacity="0.25"/>
  <circle cx="150" cy="450" r="1.5" fill="#D7CCC8" opacity="0.2"/>
</svg>